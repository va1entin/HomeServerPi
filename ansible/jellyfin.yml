---
- name: Jellyfin
  hosts: "pi4"
  vars:
    media_dir: "/mnt/data/vault"
  tasks:
    - name: Start Jellyfin container reachable on {{ ansible_facts.default_ipv4.address }}
      containers.podman.podman_container:
        name: jellyfin
        image: "docker.io/jellyfin/jellyfin:12.1"
        detach: true
        restart_policy: always
        ports:
          - "{{ ansible_facts.default_ipv4.address }}:8096:8096"
          - "{{ ansible_facts.default_ipv4.address }}:7359:7359"
        volumes:
          - "/etc/localtime:/etc/localtime:ro"
          - "jellyfin-config:/config"
          - "jellyfin-cache:/cache"
        mounts:
          - "type=bind,src={{ media_dir }},dst=/mnt/media,ro=true"
        state: started
